<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具箱 | Personal Toolbox</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover-border: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --tag-bg: #eff6ff;
      --tag-text: #1d4ed8;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2.5rem 1rem;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .search-bar {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }

    .search-bar input {
      width: 100%;
      max-width: 480px;
      padding: 0.75rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: var(--shadow-hover);
    }

    .card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      flex-grow: 1;
      margin-bottom: 1rem;
    }

    .card .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 500;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 3rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>工具箱 Portal</h1>
      <p>點選卡片開啟各項工具或專案</p>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜尋工具名稱、描述或標籤..." />
    </div>

    <main class="grid" id="toolsGrid">
      <!-- 卡片由 JS 自動生成 -->
    </main>
  </div>

  <script>
    // 未來擴充工具，在此陣列新增物件即可
    const tools = [
      {
        title: "影像標註工具",
        desc: "支援框選、標記與圖片前處理操作的輕量標註工具。",
        path: "tools/image-labeler.html",
        tags: ["Vision", "Labeling", "Dataset"]
      },
      {
        title: "範例硬體計算器",
        desc: "電阻分壓、濾波截止頻率與常用元件參數估算。",
        path: "#",
        tags: ["Hardware", "EE"]
      }
    ];

    const grid = document.getElementById("toolsGrid");
    const searchInput = document.getElementById("searchInput");

    function renderTools(filterText = "") {
      grid.innerHTML = "";
      const lowerFilter = filterText.toLowerCase();

      const filtered = tools.filter(t => 
        t.title.toLowerCase().includes(lowerFilter) ||
        t.desc.toLowerCase().includes(lowerFilter) ||
        t.tags.some(tag => tag.toLowerCase().includes(lowerFilter))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">查無符合條件的工具</div>`;
        return;
      }

      filtered.forEach(tool => {
        const card = document.createElement("a");
        card.href = tool.path;
        card.className = "card";
        card.innerHTML = `
          <div>
            <h2>${tool.title}</h2>
            <p>${tool.desc}</p>
          </div>
          <div class="tags">
            ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", (e) => {
      renderTools(e.target.value);
    });

    renderTools();
  </script>
</body>
</html>
