<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖片標註工具</title>
<style>
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --fg: #14171c;
    --muted: #6a7280;
    --line: #dde1e7;
    --accent: #2f5bea;
    --accent-fg: #ffffff;
    --drop: #f6f8fb;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.06);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #181b21; --fg: #eceef2; --muted: #8a93a3;
    --line: #292e37; --accent: #6b8cff; --accent-fg: #0b0e16; --drop: #1d2128;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .theme {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 9px; padding: 6px 10px; font-size: 12px; line-height: 1.4;
  }
  .theme:hover { border-color: var(--accent); color: var(--fg); }
  .sizebox { display: flex; align-items: center; gap: 14px; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; cursor: pointer; }
  .sizeval { width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Segoe UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    min-height: 100vh;
    padding: 32px 16px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .app {
    width: 100%; max-width: 760px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow);
    padding: 24px; display: grid; gap: 20px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .drop {
    border: 1.5px dashed var(--line); background: var(--drop);
    border-radius: 12px; min-height: 240px; padding: 12px;
    display: grid; place-items: center; text-align: center;
    transition: border-color .15s, background .15s;
    position: relative; overflow: hidden;
  }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--drop)); }
  .drop .hint { display: grid; gap: 12px; justify-items: center; color: var(--muted); }
  .drop .hint svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .drop canvas { max-width: 100%; max-height: 60vh; height: auto; border-radius: 6px; display: none; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .drop.has canvas { display: block; }
  .drop.has .hint { display: none; }

  button { font: inherit; cursor: pointer; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    padding: 9px 16px; border-radius: 9px; font-weight: 550;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fields { display: grid; grid-template-columns: 160px 1fr; gap: 14px 16px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  select, input[type="text"] {
    font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; width: 100%;
    min-width: 0;
  }
  select:hover, input[type="text"]:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .fname { display: flex; align-items: center; }
  .fname input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .fname .ext {
    padding: 9px 12px; border: 1px solid var(--line); border-left: 0;
    border-radius: 0 9px 9px 0; color: var(--muted); background: var(--drop); font-size: 14px;
  }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } body { padding: 16px 12px; } .app { padding: 16px; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>圖片標註工具</h1>
      <p class="sub">在圖片左上角自動加註「機種 + 標註文字」</p>
    </div>
    <button class="theme" id="theme" type="button">深色模式</button>
  </header>

  <section id="drop" class="drop" aria-label="上傳圖片">
    <div class="hint">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <div>拖曳圖片到這裡，或直接貼上（Ctrl+V）</div>
      <button class="btn" id="pick" type="button">選擇圖片</button>
    </div>
    <canvas id="cv"></canvas>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <section class="fields">
    <div class="field">
      <label for="model">機種</label>
      <select id="model">
        <option>C90A</option><option>C90Q</option><option>C90</option><option>C93</option><option>UIR</option>
      </select>
    </div>
    <div class="field">
      <label for="text">標註文字</label>
      <input id="text" type="text" placeholder="例如：Test01" autocomplete="off">
    </div>
    <div class="field wide">
      <label for="size">字體大小</label>
      <div class="sizebox">
        <input id="size" type="range" min="40" max="300" step="5" value="100">
        <span class="sizeval" id="sizeval">100%</span>
      </div>
    </div>
    <div class="field wide">
      <label for="name">檔案名稱（自動同步標註文字，可手動修改）</label>
      <div class="fname"><input id="name" type="text" autocomplete="off"><span class="ext" id="ext">.png</span></div>
    </div>
  </section>

  <div class="row">
    <span class="meta" id="meta">尚未載入圖片</span>
    <div style="display:flex;gap:10px">
      <button class="btn" id="reset" type="button" disabled>更換圖片</button>
      <button class="btn primary" id="dl" type="button" disabled>下載圖片</button>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop = $('drop'), cv = $('cv'), ctx = cv.getContext('2d');
  const file = $('file'), model = $('model'), text = $('text'), name = $('name');
  const ext = $('ext'), meta = $('meta'), dl = $('dl'), reset = $('reset');
  const size = $('size'), sizeval = $('sizeval'), themeBtn = $('theme');

  // 預設亮色；可手動切換深色
  themeBtn.addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark';
    if (dark) { delete root.dataset.theme; themeBtn.textContent = '深色模式'; }
    else { root.dataset.theme = 'dark'; themeBtn.textContent = '亮色模式'; }
  });

  size.addEventListener('input', () => { sizeval.textContent = size.value + '%'; draw(); });

  let img = null, mime = 'image/png', nameTouched = false, origName = '';

  const BG = '#f0f0f0';   // 非純白底
  const FG = '#111111';

  function labelString() {
    return (model.value + ' ' + text.value.trim()).trim();
  }

  function draw() {
    if (!img) return;
    const w = img.naturalWidth, h = img.naturalHeight;
    cv.width = w; cv.height = h;
    ctx.drawImage(img, 0, 0);

    const k = size.value / 100;
    const s = Math.max(Math.min(w, h * 1.6) * 0.035 * k, 8);   // 依圖片尺寸與滑桿縮放
    const padX = s * 0.6, padY = s * 0.4;
    ctx.font = `600 ${s}px "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif`;
    ctx.textBaseline = 'top';
    const str = labelString();
    const tw = ctx.measureText(str).width;
    const bw = Math.min(tw + padX * 2, w), bh = s * 1.2 + padY * 2;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, bw, bh);
    ctx.fillStyle = FG;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, bw, bh); ctx.clip();
    ctx.fillText(str, padX, padY + s * 0.1);
    ctx.restore();
  }

  function syncExt() {
    ext.textContent = mime === 'image/png' ? '.png' : '.jpg';
  }

  function load(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      img = im;
      mime = (f.type === 'image/png' || f.type === 'image/webp' || f.type === 'image/gif') ? 'image/png' : 'image/jpeg';
      origName = (f.name || '').replace(/\.[^.]+$/, '');
      if (!nameTouched || !name.value) { name.value = text.value.trim() || origName; nameTouched = false; }
      syncExt();
      drop.classList.add('has');
      dl.disabled = false; reset.disabled = false;
      meta.textContent = `${im.naturalWidth} × ${im.naturalHeight} px`;
      draw();
      URL.revokeObjectURL(url);
    };
    im.onerror = () => { meta.textContent = '無法讀取此圖片'; URL.revokeObjectURL(url); };
    im.src = url;
  }

  // 上傳
  $('pick').addEventListener('click', e => { e.stopPropagation(); file.click(); });
  reset.addEventListener('click', () => file.click());
  file.addEventListener('change', () => { load(file.files[0]); file.value = ''; });

  // 拖拉
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => load(e.dataTransfer.files[0]));
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());

  // 貼上
  document.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) load(item.getAsFile());
  });

  // 輸入同步
  text.addEventListener('input', () => {
    if (!nameTouched) name.value = text.value.trim();
    draw();
  });
  name.addEventListener('input', () => { nameTouched = name.value !== text.value.trim(); });
  model.addEventListener('change', draw);

  // 下載
  dl.addEventListener('click', () => {
    if (!img) return;
    const base = (name.value.trim() || text.value.trim() || origName || 'image')
      .replace(/[\\/:*?"<>|]/g, '_');
    cv.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = base + (mime === 'image/png' ? '.png' : '.jpg');
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, mime, 0.95);
  });
})();
</script>
</body>
</html>
