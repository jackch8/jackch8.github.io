<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDR Stress Viewer</title>
<style>
:root{
  color-scheme:light;   /* 強制亮色，不跟隨系統深色模式 */
  --bg:#f6f7f9; --panel:#fff; --text:#1f2937; --muted:#6b7280; --grid:#e5e7eb;
  --axis:#9ca3af; --accent:#2563eb; --mark:#dc2626; --tip:#111827e6; --tiptext:#f9fafb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--grid);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
#fname{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;line-height:1.2;transition:background .15s,color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:#1d4ed8;border-color:#1d4ed8;box-shadow:0 1px 4px rgba(37,99,235,.35)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.btn.ghost{background:#fff;color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:#eff6ff;box-shadow:none}
.btn.danger{background:#fff;color:var(--mark);border-color:var(--mark)}
.btn.danger:hover{background:#fef2f2;box-shadow:none}
.btn.sm{padding:3px 11px;font-size:12px;border-radius:5px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.tools{display:flex;gap:6px}
.spacer{flex:1}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
#drop{border:2px dashed var(--axis);border-radius:10px;padding:48px;text-align:center;color:var(--muted)}
#drop.over{border-color:var(--accent);color:var(--accent)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border-radius:8px;padding:10px 14px;border:1px solid var(--grid)}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:20px;font-weight:600;margin-top:2px}
.card .s{color:var(--muted);font-size:12px}
.chart{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:12px 14px 10px;margin-bottom:14px}
.chart h2{font-size:14px;margin:0;font-weight:600}
canvas{width:100%;height:270px;display:block;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px}
.chip{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 6px;border-radius:4px;user-select:none}
.chip:hover{background:var(--bg)}
.chip.off{opacity:.35;text-decoration:line-through}
.chip i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chip small{color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>DDR Stress Viewer</h1>
  <span id="fname"></span>
  <span class="spacer"></span>
  <button class="btn ghost hidden" id="reset">重設縮放</button>
  <button class="btn" id="pick">開啟 CSV</button>
  <input type="file" id="file" accept=".csv,text/csv" class="hidden">
</header>
<main>
  <div id="drop">把 CSV 檔拖曳到這裡，或點右上角「開啟 CSV」</div>
  <div id="view" class="hidden">
    <div id="cards"></div>
    <p class="hint">滑鼠移動查看數值；在圖上按住拖曳可縮放時間範圍（所有圖表同步）；雙擊還原；點圖例可顯示/隱藏曲線；紅色虛線為壓測開始。</p>
    <div id="charts"></div>
  </div>
</main>

<script>
const EMBEDDED=/*__EMBEDDED_CSV__*/null;

const $=s=>document.querySelector(s);
let D=null, charts=[], view=null, hoverT=null, hoverChart=null, sel=null;

/* ---------- CSV ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    }else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}

function load(text,name){
  const rows=parseCSV(text).filter(r=>r.length>1);
  if(rows.length<2){alert('CSV 沒有資料');return;}
  const head=rows.shift();
  const cols={};
  head.forEach((h,j)=>{
    const vals=rows.map(r=>r[j]===undefined?'':r[j]);
    const num=vals.map(v=>v===''?NaN:Number(v));
    cols[h]=num.some(x=>!isNaN(x))?num:vals;
  });
  const n=rows.length;
  let t;
  if(cols.epoch){const e0=cols.epoch[0]; t=cols.epoch.map(e=>e-e0);}
  else t=Array.from({length:n},(_,i)=>i);

  // derived memory columns (MB)
  if(cols.mem_total_kb&&cols.mem_available_kb){
    cols.mem_available_mb=cols.mem_available_kb.map(v=>v/1024);
    cols.mem_used_mb=cols.mem_total_kb.map((v,i)=>(v-cols.mem_available_kb[i])/1024);
    if(cols.mem_free_kb) cols.mem_free_mb=cols.mem_free_kb.map(v=>v/1024);
  }
  if(cols.swap_total_kb&&cols.swap_free_kb&&cols.swap_total_kb.some(v=>v>0))
    cols.swap_used_mb=cols.swap_total_kb.map((v,i)=>(v-cols.swap_free_kb[i])/1024);

  let stressT=null;
  if(cols.stress_running){const i=cols.stress_running.findIndex(v=>v===1); if(i>=0) stressT=t[i];}

  D={name,cols,t,n,stressT};
  view={x0:t[0],x1:t[n-1]};
  $('#fname').textContent=name+'  ('+n+' 筆)';
  $('#drop').classList.add('hidden');
  $('#view').classList.remove('hidden');
  build();
}

/* ---------- helpers ---------- */
const fmtT=s=>{
  s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=v=>String(v).padStart(2,'0');
  return h>0?`${h}:${p(m)}:${p(x)}`:`${m}:${p(x)}`;
};
const fmtN=(v,d=1)=>isNaN(v)?'-':(Math.abs(v)>=1000?v.toFixed(0):v.toFixed(d));
function stats(a){
  let mn=Infinity,mx=-Infinity,sum=0,c=0;
  for(const v of a){ if(isNaN(v)) continue; if(v<mn)mn=v; if(v>mx)mx=v; sum+=v; c++; }
  return c?{min:mn,max:mx,avg:sum/c}:null;
}
function lowerBound(arr,x){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<x)lo=m+1;else hi=m;}return lo;}
function niceStep(range,target){
  const raw=range/target, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  return (f<1.5?1:f<3?2:f<7?5:10)*p;
}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- groups ---------- */
const GROUPS=[
  {title:'溫度 (°C)', test:n=>n==='max_temp_c'||n.startsWith('temp_'), bold:'max_temp_c', unit:'°C', toggleAll:true},
  {title:'CPU 使用率 (%)', cols:['cpu_usage_pct'], unit:'%', min:0, max:100},
  {title:'CPU 頻率 (MHz)', test:n=>n.startsWith('freq_'), unit:'MHz'},
  {title:'Load Average', cols:['load1','load5','load15','procs_running'], unit:''},
  {title:'記憶體 (MB)', cols:['mem_used_mb','mem_available_mb','mem_free_mb','swap_used_mb'], unit:'MB'},
];

function build(){
  const box=$('#charts'); box.innerHTML=''; charts=[];
  const c=D.cols;

  // summary cards
  const cards=[];
  const dur=D.t[D.n-1];
  cards.push(['記錄時間',fmtT(dur),D.n+' 筆']);
  if(c.test_time_s){const mt=Math.max(...c.test_time_s.filter(v=>!isNaN(v)));cards.push(['壓測時間',fmtT(mt),'']);}
  if(c.max_temp_c){
    const s=stats(c.max_temp_c); const i=c.max_temp_c.indexOf(s.max);
    cards.push(['最高溫度',s.max.toFixed(1)+' °C',(c.max_temp_sensor?c.max_temp_sensor[i]:'')+' @ '+fmtT(D.t[i])]);
    cards.push(['平均最高溫',s.avg.toFixed(1)+' °C','']);
  }
  if(c.cpu_usage_pct){const s=stats(c.cpu_usage_pct); if(s) cards.push(['CPU 使用率',s.avg.toFixed(1)+' %','max '+s.max.toFixed(1)+' %']);}
  if(c.load1){const s=stats(c.load1); cards.push(['Load1 最大',s.max.toFixed(2),'avg '+s.avg.toFixed(2)]);}
  if(c.mem_available_mb){const s=stats(c.mem_available_mb); cards.push(['最低可用記憶體',s.min.toFixed(0)+' MB','total '+(c.mem_total_kb[0]/1024).toFixed(0)+' MB']);}
  $('#cards').innerHTML=cards.map(([k,v,s])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div>`).join('');

  for(const g of GROUPS){
    let names=g.cols?g.cols.filter(n=>c[n]):Object.keys(c).filter(g.test);
    names=names.filter(n=>typeof c[n][0]==='number'||c[n].some(v=>typeof v==='number'&&!isNaN(v)));
    names=names.filter(n=>c[n].some(v=>!isNaN(v)));
    if(!names.length) continue;
    const series=names.map((n,i)=>({
      name:n.replace(/^temp_|^freq_|_mhz$/g,''), key:n, data:c[n], hidden:false,
      color:n===g.bold?css('--mark'):`hsl(${Math.round(i*360/names.length)},65%,50%)`,
      width:n===g.bold?2.4:1.4, st:stats(c[n])
    }));
    const el=document.createElement('div'); el.className='chart';
    const tools=g.toggleAll?`<div class="tools"><button class="btn sm" data-act="on">All On</button><button class="btn sm ghost" data-act="off">All Off</button></div>`:'';
    el.innerHTML=`<div class="chart-head"><h2>${g.title}</h2>${tools}</div><canvas></canvas><div class="legend"></div>`;
    box.appendChild(el);
    const ch={g,series,canvas:el.querySelector('canvas'),legend:el.querySelector('.legend')};
    ch.legend.innerHTML=series.map((s,i)=>`<span class="chip" data-i="${i}"><i style="background:${s.color}"></i>${s.name}<small>${fmtN(s.st.min)} / ${fmtN(s.st.avg)} / ${fmtN(s.st.max)}</small></span>`).join('');
    ch.legend.addEventListener('click',e=>{
      const chip=e.target.closest('.chip'); if(!chip) return;
      const s=series[+chip.dataset.i]; s.hidden=!s.hidden; chip.classList.toggle('off',s.hidden); drawAll();
    });
    const tb=el.querySelector('.tools');
    if(tb) tb.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      const off=b.dataset.act==='off';
      series.forEach(s=>s.hidden=off);
      ch.legend.querySelectorAll('.chip').forEach(c=>c.classList.toggle('off',off));
      drawAll();
    });
    attach(ch); charts.push(ch);
  }
  drawAll();
}

/* ---------- interaction ---------- */
function attach(ch){
  const cv=ch.canvas, M={l:58,r:14,t:10,b:26};
  ch.M=M;
  const xToT=px=>{const w=cv.clientWidth-M.l-M.r; return view.x0+(px-M.l)/w*(view.x1-view.x0);};
  let down=null;
  cv.addEventListener('mousemove',e=>{
    const r=cv.getBoundingClientRect(), px=e.clientX-r.left;
    hoverT=xToT(px); hoverChart=ch;
    if(down!==null) sel=[Math.min(down,px),Math.max(down,px)];
    drawAll();
  });
  cv.addEventListener('mouseleave',()=>{hoverT=null;hoverChart=null;if(down===null)drawAll();});
  cv.addEventListener('mousedown',e=>{down=e.clientX-cv.getBoundingClientRect().left;sel=null;});
  window.addEventListener('mouseup',()=>{
    if(down===null) return;
    if(sel&&sel[1]-sel[0]>6){
      const a=xToT(sel[0]), b=xToT(sel[1]);
      view={x0:Math.max(D.t[0],a),x1:Math.min(D.t[D.n-1],b)};
      $('#reset').classList.remove('hidden');
    }
    down=null; sel=null; drawAll();
  });
  cv.addEventListener('dblclick',resetView);
}
function resetView(){view={x0:D.t[0],x1:D.t[D.n-1]};$('#reset').classList.add('hidden');drawAll();}
$('#reset').onclick=resetView;

/* ---------- drawing ---------- */
function drawAll(){ if(D) charts.forEach(draw); }

function draw(ch){
  const cv=ch.canvas, dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const M=ch.M, pw=W-M.l-M.r, ph=H-M.t-M.b;
  const t=D.t, i0=Math.max(0,lowerBound(t,view.x0)-1), i1=Math.min(D.n-1,lowerBound(t,view.x1));
  const colGrid=css('--grid'), colAxis=css('--axis'), colMuted=css('--muted');

  // y range over visible range
  let ymin=Infinity,ymax=-Infinity;
  for(const s of ch.series){ if(s.hidden) continue;
    for(let i=i0;i<=i1;i++){const v=s.data[i]; if(isNaN(v)) continue; if(v<ymin)ymin=v; if(v>ymax)ymax=v;} }
  if(!isFinite(ymin)){ymin=0;ymax=1;}
  if(ymax-ymin<1e-9){ymin-=1;ymax+=1;}
  const pad=(ymax-ymin)*0.06; ymin-=pad; ymax+=pad;
  if(ch.g.min!==undefined) ymin=ch.g.min; if(ch.g.max!==undefined) ymax=ch.g.max;
  if(ch.g.min===0&&ymin<0) ymin=0;
  const X=v=>M.l+(v-view.x0)/(view.x1-view.x0)*pw;
  const Y=v=>M.t+(1-(v-ymin)/(ymax-ymin))*ph;

  ctx.font='11px system-ui,sans-serif'; ctx.lineWidth=1;
  // y grid
  const ys=niceStep(ymax-ymin,5);
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let v=Math.ceil(ymin/ys)*ys; v<=ymax; v+=ys){
    const y=Math.round(Y(v))+.5;
    ctx.strokeStyle=colGrid; ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke();
    ctx.fillStyle=colMuted; ctx.fillText(+v.toFixed(6)+'',M.l-6,y);
  }
  // x grid
  const steps=[1,2,5,10,15,30,60,120,300,600,900,1800,3600,7200,14400];
  const span=view.x1-view.x0; let xs=steps.find(s=>span/s<=9)||steps[steps.length-1];
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let v=Math.ceil(view.x0/xs)*xs; v<=view.x1; v+=xs){
    const x=Math.round(X(v))+.5;
    ctx.strokeStyle=colGrid; ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();
    ctx.fillStyle=colMuted; ctx.fillText(fmtT(v),x,M.t+ph+6);
  }
  ctx.strokeStyle=colAxis; ctx.strokeRect(M.l+.5,M.t+.5,pw,ph);

  // clip & lines
  ctx.save(); ctx.beginPath(); ctx.rect(M.l,M.t,pw,ph); ctx.clip();
  if(D.stressT!==null&&D.stressT>=view.x0&&D.stressT<=view.x1){
    const x=Math.round(X(D.stressT))+.5;
    ctx.strokeStyle=css('--mark'); ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke(); ctx.setLineDash([]);
  }
  const maxPts=pw*2, stride=Math.max(1,Math.floor((i1-i0)/maxPts));
  for(const s of ch.series){ if(s.hidden) continue;
    ctx.strokeStyle=s.color; ctx.lineWidth=s.width; ctx.beginPath(); let pen=false;
    for(let i=i0;i<=i1;i+=stride){
      const v=s.data[i]; if(isNaN(v)){pen=false;continue;}
      const x=X(t[i]), y=Y(v);
      if(pen) ctx.lineTo(x,y); else {ctx.moveTo(x,y);pen=true;}
    }
    ctx.stroke();
  }
  ctx.restore();

  // selection
  if(sel&&hoverChart===ch){
    ctx.fillStyle='rgba(37,99,235,.18)'; ctx.fillRect(sel[0],M.t,sel[1]-sel[0],ph);
  }

  // hover
  if(hoverT!==null&&hoverT>=view.x0&&hoverT<=view.x1){
    let k=lowerBound(t,hoverT); if(k>0&&(k>=D.n||hoverT-t[k-1]<t[k]-hoverT)) k--; if(k>=D.n)k=D.n-1;
    const x=Math.round(X(t[k]))+.5;
    ctx.strokeStyle=colAxis; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke(); ctx.setLineDash([]);
    for(const s of ch.series){ if(s.hidden||isNaN(s.data[k])) continue;
      ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(x,Y(s.data[k]),3,0,6.3); ctx.fill(); }
    if(hoverChart===ch&&!sel){
      const ts=D.cols.timestamp?D.cols.timestamp[k]:'';
      const lines=[fmtT(t[k])+(ts?'   '+ts:'')];
      const vis=ch.series.filter(s=>!s.hidden&&!isNaN(s.data[k]));
      vis.slice(0,14).forEach(s=>lines.push([s,`${s.name}: ${fmtN(s.data[k],2)} ${ch.g.unit}`]));
      if(vis.length>14) lines.push('… 其餘 '+(vis.length-14)+' 條');
      ctx.font='12px system-ui,sans-serif';
      const wTxt=Math.max(...lines.map(l=>ctx.measureText(typeof l==='string'?l:l[1]).width))+30;
      const bh=lines.length*17+8; let bx=x+12; if(bx+wTxt>W-4) bx=x-12-wTxt; const by=M.t+4;
      ctx.fillStyle=css('--tip'); ctx.fillRect(bx,by,wTxt,bh);
      ctx.textAlign='left'; ctx.textBaseline='middle';
      lines.forEach((l,i)=>{
        const y=by+4+i*17+8.5;
        if(typeof l==='string'){ctx.fillStyle=css('--tiptext');ctx.fillText(l,bx+8,y);}
        else{ctx.fillStyle=l[0].color;ctx.fillRect(bx+8,y-1.5,10,3);ctx.fillStyle=css('--tiptext');ctx.fillText(l[1],bx+22,y);}
      });
    }
  }
}

/* ---------- file loading ---------- */
function readFile(f){const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f);}
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);};
const drop=$('#drop');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f) readFile(f);});
window.addEventListener('resize',drawAll);

if(EMBEDDED) load(EMBEDDED.text,EMBEDDED.name);
</script>
</body>
</html>
