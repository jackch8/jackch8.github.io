<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電阻分壓 / RC Delay 計算工具</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1b2437; --muted:#6b7690; --line:#e4e8f1;
    --accent:#3b6cf6; --accent-soft:#eaf0ff; --ok:#12a37f; --warn:#e5890a; --err:#d9453b;
    --radius:18px; --shadow:0 10px 30px rgba(40,60,120,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(1200px 500px at 50% -10%,#e3ebff 0%,var(--bg) 60%);
    padding:32px 16px 60px;
  }
  .wrap{max-width:900px;margin:0 auto}
  header{margin-bottom:20px}
  h1{font-size:26px;margin:0 0 4px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:18px;border:1px solid var(--line)}
  .card h2{font-size:15px;margin:0 0 14px;color:var(--muted);font-weight:600;letter-spacing:.5px}

  .seg{display:inline-flex;flex-wrap:wrap;background:#eef1f8;border-radius:14px;padding:4px;gap:2px}
  .seg button{
    border:0;background:transparent;font:inherit;font-weight:600;font-size:14px;color:var(--muted);
    padding:9px 16px;border-radius:11px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(40,60,120,.12)}
  .tabs{margin-bottom:18px}
  .tabs .seg button{font-size:16px;padding:11px 22px}
  .modebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .modebar span{font-size:13px;color:var(--muted)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .fields{display:grid;gap:14px}
  .field>span{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field>span em{font-style:normal;color:var(--accent);font-size:12px}
  .inp{display:flex;border:2px solid var(--line);border-radius:14px;background:#fbfcff;overflow:hidden;transition:.15s}
  .inp:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
  .inp input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:20px;font-weight:600;padding:11px 14px;color:var(--ink)}
  .inp .suf,.inp select{
    border:0;background:#f1f4fb;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:0 14px;
    display:flex;align-items:center;outline:none;
  }
  .inp select{cursor:pointer;padding-right:8px}
  .inp.out{background:var(--accent-soft);border-color:#c6d6ff}
  .inp.out input{color:var(--accent)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fcfdff;cursor:pointer;transition:.15s}
  .stat:hover{border-color:var(--accent);background:var(--accent-soft)}
  .stat small{display:block;color:var(--muted);font-size:12px;font-weight:600}
  .stat b{font-size:18px;word-break:break-all}
  .stat.big{grid-column:1/-1;background:linear-gradient(135deg,#3b6cf6,#6c8cff);border:0;color:#fff}
  .stat.big small{color:#fff;opacity:.85}
  .stat.big b{font-size:28px}
  .msg{min-height:22px;font-size:13px;color:var(--err);margin-top:6px}
  .note{font-size:13px;color:var(--muted);background:#f6f8fd;border-radius:12px;padding:10px 14px;line-height:1.6}
  .note b{color:var(--ink)}
  .formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);margin-top:10px}
  svg text{font-family:inherit}
  .hidden{display:none}
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1b2437;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>電阻分壓 / RC Delay 計算</h1>
    <p>選擇要求解的未知數，其餘填入即可即時計算</p>
  </header>

  <div class="tabs"><div class="seg" id="tabs">
    <button data-t="div" class="on">電阻分壓</button>
    <button data-t="rc">RC Delay</button>
  </div></div>

  <!-- ============ 電阻分壓 ============ -->
  <section class="card" id="p-div">
    <div class="modebar"><span>求解：</span>
      <div class="seg" id="divMode">
        <button data-m="vout" class="on">Vout</button>
        <button data-m="vin">Vin</button>
        <button data-m="r1">R1</button>
        <button data-m="r2">R2</button>
      </div>
    </div>
    <div class="cols">
      <div>
        <div class="fields">
          <label class="field"><span>Vin 輸入電壓</span><div class="inp" id="w-vin"><input id="vin" type="number" step="any" value="5"><div class="suf">V</div></div></label>
          <label class="field"><span>R1 上臂電阻</span><div class="inp" id="w-r1"><input id="r1" type="number" step="any" value="10"><select id="r1u"></select></div></label>
          <label class="field"><span>R2 下臂電阻</span><div class="inp" id="w-r2"><input id="r2" type="number" step="any" value="10"><select id="r2u"></select></div></label>
          <label class="field"><span>Vout 輸出電壓</span><div class="inp" id="w-vout"><input id="vout" type="number" step="any"><div class="suf">V</div></div></label>
        </div>
        <div class="msg" id="divMsg"></div>
      </div>
      <div>
        <svg viewBox="0 0 260 210" width="100%" style="max-height:220px;margin-bottom:6px">
          <g stroke="#6b7690" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 20 H130 V45"/>
            <path d="M120 45 h20 v50 h-20 z" fill="#eaf0ff" stroke="#3b6cf6"/>
            <path d="M130 95 V115"/>
            <path d="M130 115 H190"/>
            <path d="M120 125 h20 v50 h-20 z" fill="#eaf0ff" stroke="#3b6cf6"/>
            <path d="M130 115 v10"/>
            <path d="M130 175 V190 M112 190 H148 M118 196 H142 M124 202 H136"/>
          </g>
          <circle cx="60" cy="20" r="4" fill="#3b6cf6"/><circle cx="190" cy="115" r="4" fill="#12a37f"/><circle cx="130" cy="115" r="3.5" fill="#6b7690"/>
          <g font-size="13" font-weight="600" fill="#1b2437">
            <text x="20" y="24">Vin</text><text x="150" y="75">R1</text><text x="150" y="155">R2</text><text x="198" y="119" fill="#12a37f">Vout</text>
          </g>
        </svg>
        <div class="stats" id="divStats"></div>
        <div class="note" id="divNote"></div>
        <div class="formula">Vout = Vin × R2 / (R1 + R2)</div>
      </div>
    </div>
  </section>

  <!-- ============ RC Delay ============ -->
  <section class="card hidden" id="p-rc">
    <div class="modebar"><span>求解：</span>
      <div class="seg" id="rcMode">
        <button data-m="t" class="on">延遲時間 t</button>
        <button data-m="r">R</button>
        <button data-m="c">C</button>
      </div>
      <span style="margin-left:8px">方式：</span>
      <div class="seg" id="rcDir">
        <button data-d="chg" class="on">充電 ↑</button>
        <button data-d="dis">放電 ↓</button>
      </div>
    </div>
    <div class="cols">
      <div>
        <div class="fields">
          <label class="field"><span>R 電阻</span><div class="inp" id="w-R"><input id="R" type="number" step="any" value="10"><select id="Ru"></select></div></label>
          <label class="field"><span>C 電容</span><div class="inp" id="w-C"><input id="C" type="number" step="any" value="100"><select id="Cu"></select></div></label>
          <label class="field"><span>Vcc 電源 / 初始電壓</span><div class="inp"><input id="Vcc" type="number" step="any" value="3.3"><div class="suf">V</div></div></label>
          <label class="field"><span id="vthLabel">Vth 目標電壓</span><div class="inp"><input id="Vth" type="number" step="any" value="2.0"><div class="suf">V</div></div></label>
          <label class="field"><span>t 延遲時間</span><div class="inp" id="w-T"><input id="T" type="number" step="any"><select id="Tu"></select></div></label>
        </div>
        <div class="msg" id="rcMsg"></div>
      </div>
      <div>
        <div class="stats" id="rcStats"></div>
        <svg id="chart" viewBox="0 0 440 230" width="100%"></svg>
        <div class="formula" id="rcFormula"></div>
      </div>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const num = id => { const s = $(id).value; return s === '' ? NaN : parseFloat(s); };

/* ---------- 共用工具 ---------- */
function eng(v, u, d = 4){
  if (!isFinite(v)) return '—';
  if (v === 0) return '0 ' + u;
  const P = [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  const a = Math.abs(v);
  const p = P.find(([s]) => a >= s * 0.9999999) || P[P.length - 1];
  return Number((v / p[0]).toPrecision(d)) + ' ' + p[1] + u;
}
const clean = (x, d = 6) => Number(x.toPrecision(d));
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400);
}
function copy(text){
  const ok = () => toast('已複製：' + text);
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => toast(text)); else toast(text);
}
function fillUnits(sel, list, def){
  list.forEach(([k]) => { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
  sel.value = def;
}
const factor = (selId, list) => list.find(([k]) => k === $(selId).value)[1];
// 將基礎值寫入欄位，並自動挑選合適單位
function setWithUnit(inId, selId, list, base){
  let pick = list[list.length - 1];
  for (const u of list) if (Math.abs(base) / u[1] >= 1) { pick = u; break; }
  $(selId).value = pick[0];
  $(inId).value = clean(base / pick[1]);
}
function stats(el, items){
  el.innerHTML = '';
  items.forEach(([label, text, big]) => {
    const d = document.createElement('div');
    d.className = 'stat' + (big ? ' big' : '');
    d.innerHTML = `<small>${label}</small><b>${text}</b>`;
    d.onclick = () => copy(text);
    el.appendChild(d);
  });
}
function segBind(id, attr, cb){
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
    $(id).querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); cb(b.dataset[attr]);
  });
}

/* ---------- 分頁 ---------- */
segBind('tabs', 't', t => {
  $('p-div').classList.toggle('hidden', t !== 'div');
  $('p-rc').classList.toggle('hidden', t !== 'rc');
});

/* ============ 電阻分壓 ============ */
const R_UNITS = [['MΩ',1e6],['kΩ',1e3],['Ω',1]];
const C_UNITS = [['mF',1e-3],['µF',1e-6],['nF',1e-9],['pF',1e-12]];
const T_UNITS = [['s',1],['ms',1e-3],['µs',1e-6],['ns',1e-9]];
fillUnits($('r1u'), R_UNITS, 'kΩ'); fillUnits($('r2u'), R_UNITS, 'kΩ');
fillUnits($('Ru'), R_UNITS, 'kΩ');  fillUnits($('Cu'), C_UNITS, 'nF'); fillUnits($('Tu'), T_UNITS, 'ms');

const E24 = [1.0,1.1,1.2,1.3,1.5,1.6,1.8,2.0,2.2,2.4,2.7,3.0,3.3,3.6,3.9,4.3,4.7,5.1,5.6,6.2,6.8,7.5,8.2,9.1];
function nearestE24(r){
  const dec = Math.floor(Math.log10(r));
  let best = null, err = Infinity;
  for (let d = dec - 1; d <= dec + 1; d++)
    for (const m of E24){
      const v = m * Math.pow(10, d), e = Math.abs(Math.log(v / r));
      if (e < err){ err = e; best = v; }
    }
  return best;
}

let divMode = 'vout';
const divWrap = {vin:'w-vin', r1:'w-r1', r2:'w-r2', vout:'w-vout'};
function setDivMode(m){
  divMode = m;
  for (const k in divWrap){
    $(divWrap[k]).classList.toggle('out', k === m);
    $(k).readOnly = (k === m);
  }
  calcDiv();
}
segBind('divMode', 'm', setDivMode);

function calcDiv(){
  const m = divMode;
  let vin = num('vin'), vout = num('vout');
  let r1 = num('r1') * factor('r1u', R_UNITS), r2 = num('r2') * factor('r2u', R_UNITS);
  const msg = $('divMsg'); msg.textContent = '';
  const need = {vout:[vin,r1,r2], vin:[vout,r1,r2], r1:[vin,vout,r2], r2:[vin,vout,r1]}[m];
  if (need.some(x => !isFinite(x))){ stats($('divStats'), []); $('divNote').innerHTML = ''; msg.textContent = '請填入其餘欄位'; return; }

  if (m === 'vout'){
    if (r1 + r2 <= 0){ msg.textContent = 'R1 + R2 必須大於 0'; return; }
    vout = vin * r2 / (r1 + r2); $('vout').value = clean(vout);
  } else if (m === 'vin'){
    if (r2 <= 0){ msg.textContent = 'R2 必須大於 0'; return; }
    vin = vout * (r1 + r2) / r2; $('vin').value = clean(vin);
  } else {
    if (!(vout > 0 && vout < vin)){ msg.textContent = '需滿足 0 < Vout < Vin'; stats($('divStats'), []); $('divNote').innerHTML=''; return; }
    if (m === 'r1'){ r1 = r2 * (vin - vout) / vout; setWithUnit('r1', 'r1u', R_UNITS, r1); }
    else            { r2 = r1 * vout / (vin - vout);  setWithUnit('r2', 'r2u', R_UNITS, r2); }
  }

  const rt = r1 + r2, i = rt > 0 ? vin / rt : NaN;
  stats($('divStats'), [
    ['Vout', eng(vout, 'V'), true],
    ['分壓比 Vout/Vin', (vin ? clean(vout / vin * 100, 5) : 0) + ' %'],
    ['總電阻', eng(rt, 'Ω')],
    ['電流 I', eng(i, 'A')],
    ['總功耗', eng(vin * i, 'W')],
    ['R1 功耗', eng(i * i * r1, 'W')],
    ['R2 功耗', eng(i * i * r2, 'W')],
  ]);

  const note = $('divNote');
  if (m === 'r1' || m === 'r2'){
    const R = m === 'r1' ? r1 : r2, E = nearestE24(R);
    const vo = m === 'r1' ? vin * r2 / (E + r2) : vin * E / (r1 + E);
    note.innerHTML = `最接近的 E24 標準值：<b>${eng(E, 'Ω', 3)}</b><br>使用後 Vout ≈ <b>${eng(vo, 'V')}</b>（誤差 ${clean((vo - vout) / vout * 100, 3)}%）`;
  } else {
    note.innerHTML = '提示：選擇「R1 / R2」可反推電阻並顯示最接近的 E24 標準值。';
  }
}
['vin','vout','r1','r2'].forEach(id => $(id).addEventListener('input', calcDiv));
['r1u','r2u'].forEach(id => $(id).addEventListener('change', calcDiv));

/* ============ RC Delay ============ */
let rcMode = 't', rcDir = 'chg';
const rcWrap = {r:'w-R', c:'w-C', t:'w-T'};
const rcInput = {r:'R', c:'C', t:'T'};
function setRcMode(m){
  rcMode = m;
  for (const k in rcWrap){
    $(rcWrap[k]).classList.toggle('out', k === m);
    $(rcInput[k]).readOnly = (k === m);
  }
  calcRC();
}
segBind('rcMode', 'm', setRcMode);
segBind('rcDir', 'd', d => { rcDir = d; calcRC(); });

function calcRC(){
  const msg = $('rcMsg'); msg.textContent = '';
  $('vthLabel').textContent = rcDir === 'chg' ? 'Vth 目標電壓（電容充到）' : 'Vth 目標電壓（電容放到）';
  const vcc = num('Vcc'), vth = num('Vth');
  let R = num('R') * factor('Ru', R_UNITS), C = num('C') * factor('Cu', C_UNITS), t = num('T') * factor('Tu', T_UNITS);
  const need = {t:[R,C], r:[C,t], c:[R,t]}[rcMode].concat([vcc, vth]);
  if (need.some(x => !isFinite(x))){ stats($('rcStats'), []); $('chart').innerHTML = ''; msg.textContent = '請填入其餘欄位'; return; }
  if (!(vcc > 0 && vth > 0 && vth < vcc)){ stats($('rcStats'), []); $('chart').innerHTML = ''; msg.textContent = '需滿足 0 < Vth < Vcc'; return; }

  // t = k · R · C
  const k = rcDir === 'chg' ? -Math.log(1 - vth / vcc) : -Math.log(vth / vcc);
  if (rcMode === 't'){ t = k * R * C; setWithUnit('T', 'Tu', T_UNITS, t); }
  else if (rcMode === 'r'){ R = t / (k * C); setWithUnit('R', 'Ru', R_UNITS, R); }
  else { C = t / (k * R); setWithUnit('C', 'Cu', C_UNITS, C); }
  if (!(R > 0 && C > 0 && t > 0)){ msg.textContent = 'R、C、t 必須大於 0'; return; }

  const tau = R * C;
  stats($('rcStats'), [
    ['延遲時間 t', eng(t, 's'), true],
    ['時間常數 τ = RC', eng(tau, 's')],
    ['截止頻率 fc', eng(1 / (2 * Math.PI * tau), 'Hz')],
    ['10%→90% 上升時間', eng(2.1972 * tau, 's')],
    ['50% 時間 (0.693τ)', eng(0.6931 * tau, 's')],
    ['穩定時間 5τ (99.3%)', eng(5 * tau, 's')],
  ]);
  $('rcFormula').textContent = rcDir === 'chg'
    ? 'V(t) = Vcc·(1 − e^(−t/RC))   →  t = −RC·ln(1 − Vth/Vcc)'
    : 'V(t) = Vcc·e^(−t/RC)   →  t = −RC·ln(Vth/Vcc)';
  drawChart(tau, t, vcc, vth);
}

function drawChart(tau, t, vcc, vth){
  const W = 440, H = 230, L = 46, Rr = 14, Tp = 14, B = 34;
  const T = Math.max(5 * tau, t * 1.25);
  const X = x => L + x / T * (W - L - Rr), Y = y => Tp + (1 - y / vcc) * (H - Tp - B);
  const f = x => rcDir === 'chg' ? vcc * (1 - Math.exp(-x / tau)) : vcc * Math.exp(-x / tau);
  let d = '';
  for (let i = 0; i <= 160; i++){ const x = T * i / 160; d += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x)).toFixed(1); }
  let g = '';
  for (let i = 0; i <= 4; i++){
    const x = T * i / 4;
    g += `<line x1="${X(x)}" x2="${X(x)}" y1="${Tp}" y2="${H - B}" stroke="#eef1f8"/>` +
         `<text x="${X(x)}" y="${H - B + 16}" font-size="10.5" fill="#6b7690" text-anchor="middle">${eng(x, 's', 3)}</text>`;
  }
  [0, vcc].forEach(v => g += `<text x="${L - 6}" y="${Y(v) + 4}" font-size="10.5" fill="#6b7690" text-anchor="end">${clean(v, 3)}V</text>`);
  $('chart').innerHTML = `
    <rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="#fbfcff"/>
    ${g}
    <line x1="${L}" x2="${L}" y1="${Tp}" y2="${H - B}" stroke="#c9d1e3"/>
    <line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" stroke="#c9d1e3"/>
    <line x1="${L}" x2="${W - Rr}" y1="${Y(vth)}" y2="${Y(vth)}" stroke="#e5890a" stroke-dasharray="4 4"/>
    <line x1="${X(t)}" x2="${X(t)}" y1="${Y(vth)}" y2="${H - B}" stroke="#e5890a" stroke-dasharray="4 4"/>
    <path d="${d}" fill="none" stroke="#3b6cf6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${X(t)}" cy="${Y(vth)}" r="5.5" fill="#fff" stroke="#e5890a" stroke-width="3"/>
    <text x="${W - Rr - 4}" y="${Y(vth) - 6}" font-size="11" font-weight="600" fill="#e5890a" text-anchor="end">Vth = ${clean(vth, 3)}V</text>
    <text x="${Math.min(X(t) + 8, W - 90)}" y="${H - B - 8}" font-size="11" font-weight="600" fill="#e5890a">t = ${eng(t, 's', 3)}</text>`;
}
['R','C','Vcc','Vth','T'].forEach(id => $(id).addEventListener('input', calcRC));
['Ru','Cu','Tu'].forEach(id => $(id).addEventListener('change', calcRC));

setDivMode('vout'); setRcMode('t');
</script>
</body>
</html>
