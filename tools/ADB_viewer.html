<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoC Stress Viewer</title>
<style>
:root{
  color-scheme:light;   /* 強制亮色，不跟隨系統深色模式 */
  --bg:#f6f7f9; --panel:#fff; --text:#1f2937; --muted:#6b7280; --grid:#e5e7eb;
  --axis:#9ca3af; --accent:#2563eb; --mark:#dc2626; --tip:#111827e6; --tiptext:#f9fafb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--grid);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
#fname{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;line-height:1.2;transition:background .15s,color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:#1d4ed8;border-color:#1d4ed8;box-shadow:0 1px 4px rgba(37,99,235,.35)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.btn.ghost{background:#fff;color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:#eff6ff;box-shadow:none}
.btn.sm{padding:3px 11px;font-size:12px;border-radius:5px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.tools{display:flex;gap:6px}
.spacer{flex:1}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
#drop{border:2px dashed var(--axis);border-radius:10px;padding:48px;text-align:center;color:var(--muted)}
#drop.over{border-color:var(--accent);color:var(--accent)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border-radius:8px;padding:10px 14px;border:1px solid var(--grid)}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:20px;font-weight:600;margin-top:2px}
.card .s{color:var(--muted);font-size:12px}
.extbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.extbar input{width:84px;font:inherit;padding:2px 4px;border:1px solid var(--grid);border-radius:4px}
.muted{color:var(--muted);font-size:12px}
.chart{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:12px 14px 10px;margin-bottom:14px}
.chart h2{font-size:14px;margin:0;font-weight:600}
canvas{width:100%;height:270px;display:block;cursor:crosshair;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px}
.legend.tall{max-height:150px;overflow:auto}
.chip{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 6px;border-radius:4px;user-select:none}
.chip:hover{background:var(--bg)}
.chip.off{opacity:.35;text-decoration:line-through}
.chip i{width:12px;height:3px;border-radius:2px;display:inline-block}
.chip small{color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.hidden{display:none}
#printinfo{display:none}
dialog#setdlg{border:1px solid var(--grid);border-radius:10px;padding:0;width:min(560px,94vw);max-height:86vh;color:var(--text)}
dialog#setdlg::backdrop{background:rgba(17,24,39,.35)}
.set-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--grid)}
.set-head h3{margin:0;font-size:15px}
.set-body{padding:6px 16px 12px;overflow:auto;max-height:calc(86vh - 110px)}
.set-body h4{font-size:13px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.set-body h4 .spacer{flex:1}
.set-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.set-list label,.set-body h4 label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.set-list.dim{opacity:.4;pointer-events:none}
.set-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--grid)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:0}
@page{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header{position:static;border:0;padding:0 0 6px}
  header .btn,#drop,.hint,.tools,#extbar input,#extclear,.extbar .muted{display:none!important}
  #printinfo{display:block;color:var(--muted);font-size:11px}
  main{padding:0;max-width:none}
  #cards{grid-template-columns:repeat(5,1fr);gap:6px}
  .card{padding:6px 10px;break-inside:avoid}
  .card .v{font-size:16px}
  .chart{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px}
  .legend.tall{max-height:none;overflow:visible}
  .chip.off{display:none}
  canvas{cursor:default}
}
</style>
</head>
<body>
<header>
  <h1>SoC Stress Viewer</h1>
  <span id="fname"></span>
  <span class="spacer"></span>
  <button class="btn ghost hidden" id="reset">重設縮放</button>
  <span id="printinfo"></span>
  <button class="btn ghost hidden" id="setbtn">設定</button>
  <button class="btn ghost hidden" id="pdf">輸出 PDF</button>
  <button class="btn" id="pick">開啟 CSV</button>
  <input type="file" id="file" accept=".csv,text/csv" multiple class="hidden">
</header>
<main>
  <div id="drop">把 CSV 檔拖曳到這裡（可一次拖兩個：SoC 主檔 + 電流檔），或點右上角「開啟 CSV」</div>
  <div id="view" class="hidden">
    <div id="cards"></div>
    <div id="extbar" class="extbar hidden">
      <span>外部電流：<b id="extname"></b></span>
      <label>時間位移 <input type="number" id="off" step="0.5" value="0"> 秒</label>
      <span class="muted">兩檔各自從第 1 筆起算為 0 秒；若電流檔比較晚開始，填正值往後移</span>
      <span class="spacer"></span>
      <button class="btn sm ghost" id="extclear">移除電流</button>
    </div>
    <p class="hint">滑鼠移動查看數值；在圖上按住拖曳可縮放時間範圍（所有圖表同步）；雙擊還原；點圖例可顯示/隱藏曲線；有 <code>stress_running</code> 欄位時，紅色虛線為壓測開始。溫度已由 mC 換算為 °C，DDR 頻寬已由 kB/s 換算為 MB/s；NA 會自動略過，全部為 NA 的圖表不會顯示。</p>
    <div id="charts"></div>
  </div>
</main>

<dialog id="setdlg">
  <div class="set-head"><h3>顯示設定</h3><span class="spacer"></span><button class="linkbtn" id="setreset">還原預設</button></div>
  <div class="set-body">
    <h4><label><input type="checkbox" id="set-cards-on"> 最上方總結卡片</label><span class="spacer"></span>
      <button class="linkbtn" data-all="cards" data-v="1">全選</button><button class="linkbtn" data-all="cards" data-v="0">全不選</button></h4>
    <div class="set-list" id="set-cards"></div>
    <h4>圖表<span class="spacer"></span>
      <button class="linkbtn" data-all="charts" data-v="1">全選</button><button class="linkbtn" data-all="charts" data-v="0">全不選</button></h4>
    <div class="set-list" id="set-charts"></div>
  </div>
  <div class="set-foot"><button class="btn ghost" id="setcancel">取消</button><button class="btn" id="setok">套用</button></div>
</dialog>

<script>
const EMBEDDED=/*__EMBEDDED_CSV__*/null;

const $=s=>document.querySelector(s);
const PAD={l:58,r:14,t:10,b:26};          // 所有圖表共用的繪圖邊界
let D=null;                               // 主檔（SoC 遙測）
let E=null;                               // 外部電流檔（Time, Current(A)）
const SET_KEY='socViewerSettings';
let SET={cardsOn:true,hideCards:[],hideCharts:[]};
try{ Object.assign(SET,JSON.parse(localStorage.getItem(SET_KEY)||'{}')); }catch(e){}
let CARD_NAMES=[], CHART_NAMES=[];
let charts=[], view=null, hoverT=null, hoverChart=null, sel=null, down=null;

/* ---------- CSV ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    }else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}

// 判斷是否為電流檔（有 Time 與 Current(A) 欄位）
function isExternal(text){
  const head=text.slice(0,400);
  return /Current\(A\)/.test(head) && /Time/.test(head);
}

// 解析 "11/23/2026 15:58:06:481" 為毫秒（UTC 計算，只用於相對時間）
function parseStamp(s){
  const m=String(s).trim().match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})(?:[:.](\d{1,3}))?/);
  if(!m) return NaN;
  return Date.UTC(+m[3],+m[1]-1,+m[2],+m[4],+m[5],+m[6])+Number(m[7]||0);
}

/* ---------- 主檔載入與正規化 ---------- */
function load(text,name){
  const rows=parseCSV(text).filter(r=>r.length>1);
  if(rows.length<3){alert('CSV 沒有足夠的資料');return;}
  const head=rows.shift().map(h=>h.trim());
  const n=rows.length;

  const cols={};
  head.forEach((h,j)=>{
    const vals=rows.map(r=>r[j]===undefined?'':r[j].trim());
    const num=vals.map(v=>(v===''||v==='NA')?NaN:Number(v));
    cols[h]=num.some(x=>!isNaN(x))?num:vals;   // 全是文字的欄位保留字串（如 iso、ON/OFF）
  });

  // ---- state.csv 格式（QC9075 state logger）欄位正規化 ----
  const ren=(a,b)=>{ if(cols[a]!==undefined&&cols[b]===undefined){cols[b]=cols[a]; delete cols[a];} };
  ren('cpu_busy','cpu_busy_pct'); ren('gpu_busy','gpu_busy_pct');
  for(let i=0;i<8;i++) ren(`cpu${i}_busy`,`cpu${i}_busy_pct`);
  ren('cdsp0_mhz','cdsp_mhz'); ren('cdsp0_lat_us','cdsp_lat_us'); ren('cdsp0_memnoc_mhz','cdsp_memnoc_mhz');
  ren('cdsp0_hmx','cdsp_hmx');
  ren('ddr_vote_avg_kBps','ddr_ebi_avg_kBps'); ren('ddr_vote_peak_kBps','ddr_ebi_peak_kBps');
  if(isNumCol(cols,'tmax_c')){cols.tmax_C=cols.tmax_c; delete cols.tmax_c;}
  // CDSP 延遲 65535 = 無效值
  for(const k of ['cdsp_lat_us','cdsp1_lat_us']) if(isNumCol(cols,k)) cols[k]=cols[k].map(v=>v>=65535?NaN:v);
  // HMX ON/OFF → 1/0
  for(const k of ['cdsp_hmx','cdsp1_hmx']) if(Array.isArray(cols[k])&&typeof cols[k][0]==='string')
    cols[k]=cols[k].map(v=>v==='ON'?1:v==='OFF'?0:NaN);
  // 熱區 t_*（mC）→ tz_*_C
  for(const k of Object.keys(cols)){
    if(/^t_.*thermal$/.test(k)&&isNumCol(cols,k)){ cols['tz_'+k.slice(2)+'_C']=cols[k].map(v=>v/1000); delete cols[k]; }
  }
  // 由熱區推算各子系統最高溫（主檔沒有 *_max 欄位時）
  const maxOf=(re,out)=>{
    if(cols[out]) return;
    const ks=Object.keys(cols).filter(k=>re.test(k)); if(!ks.length) return;
    cols[out]=Array.from({length:n},(_,i)=>{let m=NaN; for(const k of ks){const v=cols[k][i]; if(!isNaN(v)&&!(m>=v)) m=v;} return m;});
  };
  maxOf(/^tz_cpu(ss)?-.*_C$/,'cpu_max_C'); maxOf(/^tz_gpuss-.*_C$/,'gpu_max_C');
  maxOf(/^tz_nsp-.*_C$/,'nsp_max_C');      maxOf(/^tz_ddrss-.*_C$/,'ddr_max_C');
  maxOf(/^tz_pm8775-.*_C$/,'pmic_max_C');
  if(!cols.iso&&Array.isArray(cols.time)) cols.iso=cols.time;

  // 時間軸：epoch 轉為相對秒數
  const t=(cols.epoch&&!isNaN(cols.epoch[0]))
    ? cols.epoch.map(e=>e-cols.epoch[0])
    : Array.from({length:n},(_,i)=>i);

  // 溫度：毫攝氏 mC → °C（新欄位名 *_C，原 *_mC 欄位移除）
  for(const k of Object.keys(cols)){
    if(k.endsWith('_mC')&&typeof cols[k][0]==='number'){
      cols[k.slice(0,-3)+'_C']=cols[k].map(v=>v/1000);
      delete cols[k];
    }
  }
  // DDR 頻寬：kB/s → MB/s
  const kbToMB=a=>a.map(v=>v/1024);
  if(cols.ddr_ebi_avg_kBps)  cols.ddr_ebi_avg_MBps =kbToMB(cols.ddr_ebi_avg_kBps);
  if(cols.ddr_ebi_peak_kBps) cols.ddr_ebi_peak_MBps=kbToMB(cols.ddr_ebi_peak_kBps);

  // 可選：壓測起點（stress_running==1 的第一筆）
  let stressT=null;
  if(Array.isArray(cols.stress_running)){
    const i=cols.stress_running.findIndex(v=>v===1); if(i>=0) stressT=t[i];
  }

  D={name,cols,t,n,stressT,iso:Array.isArray(cols.iso)?cols.iso:null};
  $('#fname').textContent=name+'  ('+n+' 筆)';
  $('#drop').classList.add('hidden');
  $('#view').classList.remove('hidden');
  $('#pdf').classList.remove('hidden');
  $('#setbtn').classList.remove('hidden');
  resetView(); syncExtBar(); build();
}

/* ---------- 電流檔載入（Sweep #, Time, Chan 105 (VDC), Chan 106 (VDC), Current(A), Power(W)） ---------- */
function loadExternal(text,name){
  const rows=parseCSV(text).filter(r=>r.length>1);
  const head=(rows.shift()||[]).map(h=>h.trim());
  const ti=head.indexOf('Time'), ci=head.indexOf('Current(A)');
  if(ti<0||ci<0||rows.length<2){alert(`「${name}」格式不符：需要 Time 與 Current(A) 欄位，且至少 2 筆`);return;}
  // 取出指定欄位為數值陣列；欄位不存在則為 null
  const col=h=>{const j=head.indexOf(h); return j<0?null:rows.map(r=>Number(String(r[j]||'').trim()));};

  const ms=rows.map(r=>parseStamp(r[ti]));
  if(ms.some(isNaN)){alert(`「${name}」的 Time 欄位時間格式無法解析`);return;}
  const m0=ms[0];
  E={
    name, n:rows.length,
    base:ms.map(m=>(m-m0)/1000),                    // 相對第 1 筆的秒數
    clock:rows.map(r=>r[ti].trim()),                // 原始時間字串（提示用）
    cur:col('Current(A)'),          // 電流 A
    pwr:col('Power(W)'),            // 功率 W
    v105:col('Chan 105 (VDC)'),     // 電壓 V（匯流排電壓）
    v106:col('Chan 106 (VDC)'),     // Chan 106 原始讀值（分流電阻兩端電壓）
    offset:0
  };
  E.tt=E.base.map(x=>x+E.offset);
  resetView(); syncExtBar(); build();
}

// 一次處理多個檔案：主檔先於電流檔，電流檔需要主檔已載入
function readText(f){
  return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsText(f);});
}
async function handleFiles(list){
  const items=await Promise.all([...list].map(async f=>({name:f.name,text:await readText(f)})));
  items.sort((a,b)=>Number(isExternal(a.text))-Number(isExternal(b.text)));
  for(const it of items){
    if(isExternal(it.text)){
      if(!D){ alert(`請先開啟 SoC 主檔，再加入「${it.name}」`); continue; }
      loadExternal(it.text,it.name);
    }else load(it.text,it.name);
  }
}

function syncExtBar(){
  const bar=$('#extbar');
  if(!E){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  $('#extname').textContent=`${E.name}（${E.n} 筆，時長 ${fmtT(E.base[E.n-1])}）`;
  $('#off').value=E.offset;
}
$('#off').addEventListener('change',e=>{
  if(!E) return;
  const v=parseFloat(e.target.value);
  E.offset=isNaN(v)?0:v;
  E.tt=E.base.map(x=>x+E.offset);
  resetView(); build();
});
$('#extclear').onclick=()=>{ E=null; syncExtBar(); resetView(); build(); };

/* ---------- helpers ---------- */
const fmtT=s=>{
  const neg=s<0; s=Math.round(Math.abs(s));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=v=>String(v).padStart(2,'0');
  const body=h>0?`${h}:${p(m)}:${p(x)}`:`${m}:${p(x)}`;
  return (neg?'-':'')+body;
};
const fmtN=(v,d=1)=>isNaN(v)?'-':(Math.abs(v)>=1000?v.toFixed(0):v.toFixed(d));
function stats(a){
  let mn=Infinity,mx=-Infinity,sum=0,c=0;
  for(const v of a){ if(typeof v!=='number'||isNaN(v)) continue; if(v<mn)mn=v; if(v>mx)mx=v; sum+=v; c++; }
  return c?{min:mn,max:mx,avg:sum/c}:null;
}
const isNumCol=(c,k)=>Array.isArray(c[k])&&c[k].some(v=>typeof v==='number'&&!isNaN(v));
function lowerBound(arr,x){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<x)lo=m+1;else hi=m;}return lo;}
// 最接近 x 的取樣索引
function nearest(t,x){
  if(!t.length) return -1;
  let k=lowerBound(t,x);
  if(k>0&&(k>=t.length||x-t[k-1]<t[k]-x)) k--;
  return Math.min(k,t.length-1);
}
// 可見時間區間內需要繪製的索引範圍（含左右各一點，讓線段接到邊界）
function idxRange(t,x0,x1){
  return [Math.max(0,lowerBound(t,x0)-1), Math.min(t.length-1,lowerBound(t,x1))];
}
function niceStep(range,target){
  const raw=range/target, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  return (f<1.5?1:f<3?2:f<7?5:10)*p;
}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// 圖例名稱
const LABEL={
  cpu_busy_pct:'CPU 合計', cpu_mhz:'CPU 合計',
  cpu_max_C:'CPU', gpu_max_C:'GPU', nsp_max_C:'NSP', ddr_max_C:'DDR', tsens_max_C:'TSENS',
  tmax_C:'Tmax', pmic_max_C:'PMIC (PM8775)', cdsp_hmx:'CDSP0 HMX', cdsp1_hmx:'CDSP1 HMX', mem_avail_mb:'可用記憶體',
  tmp411_remote_soc_C:'TMP411 遠端SoC', tmp411_local_board_C:'TMP411 本地板'
};
function label(n){
  if(LABEL[n]) return LABEL[n];
  return n.replace(/^tz_/,'').replace(/-thermal_C$/,'')
          .replace(/_busy_pct$/,'').replace(/_mhz$/,'').replace(/_C$/,'');
}

/* ---------- 時間範圍（主檔與電流檔可能長度不同） ---------- */
function extent(){
  let a=Infinity,b=-Infinity;
  const arrs=[D.t]; if(E) arrs.push(E.tt);
  for(const t of arrs){ a=Math.min(a,t[0]); b=Math.max(b,t[t.length-1]); }
  return [a,b];
}
function resetView(){
  const [a,b]=extent();
  view={x0:a,x1:b>a?b:a+1};
  $('#reset').classList.add('hidden');
  drawAll();
}
$('#reset').onclick=resetView;

/* ---------- 外部電流檔的圖表（每個欄位一張圖） ---------- */
const EXT_SPECS=[
  {key:'cur',  title:'電流 (A)',              unit:'A', name:'Current',  dec:3, color:'#2563eb'},
  {key:'pwr',  title:'功率 (W)',              unit:'W', name:'Power',    dec:2, color:'#059669'},
  {key:'v105', title:'電壓 (V)｜Chan 105',    unit:'V', name:'Chan 105', dec:3, color:'#d97706'},
  {key:'v106', title:'Chan 106 原始讀值 (V)', unit:'V', name:'Chan 106', dec:5, color:'#7c3aed'},
];

/* ---------- 圖表分組（依 CSV 欄位） ---------- */
const CORES=[0,1,2,3,4,5,6,7];
const GROUPS=[
  {title:'溫度 (°C)｜各 SoC 感測器最高溫', unit:'°C', bold:'cpu_max_C',
   cols:['tmax_C','cpu_max_C','gpu_max_C','nsp_max_C','ddr_max_C','pmic_max_C','tsens_max_C','tmp411_remote_soc_C','tmp411_local_board_C']},
  {title:'熱區溫度 (°C)｜tz_* 全部，預設顯示最熱前 8 條', unit:'°C', toggleAll:true, top:8, tall:true,
   pattern:/^tz_.*_C$/},
  {title:'CPU 使用率 (%)', unit:'%', min:0, max:100, bold:'cpu_busy_pct',
   cols:['cpu_busy_pct',...CORES.map(i=>`cpu${i}_busy_pct`)]},
  {title:'CPU 頻率 (MHz)', unit:'MHz', bold:'cpu_mhz',
   cols:['cpu_mhz',...CORES.map(i=>`cpu${i}_mhz`)]},
  {title:'GPU 使用率 (%)', unit:'%', min:0, max:100, cols:['gpu_busy_pct']},
  {title:'GPU 頻率 (MHz)', unit:'MHz', cols:['gpu_mhz']},
  {title:'CDSP 頻率與 MemNoC (MHz)', unit:'MHz', cols:['cdsp_mhz','cdsp1_mhz','cdsp_memnoc_mhz','cdsp1_memnoc_mhz']},
  {title:'CDSP 延遲 (µs)', unit:'µs', cols:['cdsp_lat_us','cdsp1_lat_us']},
  {title:'CDSP HMX（1=ON / 0=OFF）', unit:'', min:0, max:1, cols:['cdsp_hmx','cdsp1_hmx']},
  {title:'DDR EBI 頻寬 (MB/s)', unit:'MB/s', cols:['ddr_ebi_avg_MBps','ddr_ebi_peak_MBps']},
  {title:'多媒體 FPS（相機 / VPU / 顯示）', unit:'fps',
   cols:['cam_fps','vpu_enc_fps','vpu_dec_fps','vpu_dec0_fps','vpu_dec1_fps','vpu_dec2_fps','vpu_dec3_fps','disp_fps']},
  {title:'多媒體延遲 (ms)', unit:'ms', cols:['cam_latency_ms','vpu_enc_latency_ms','disp_latency_ms']},
  {title:'掉幀 / 異常累計（次）', unit:'次',
   cols:['cam_dropped','cam_discont','cam_corrupted','cam_gap','vpu_enc_dropped',
         'vpu_dec0_dropped','vpu_dec1_dropped','vpu_dec2_dropped','vpu_dec3_dropped','disp_dropped']},
  {title:'Workload / Procs', unit:'',
   cols:['cpu_workload_ticks','gpu_workload_activity','npu_workload_activity','npu_procs','ddr_cpu_ticks','disp_cpu_ticks']},
  {title:'風扇 RPM', unit:'RPM', cols:['fan_rpm']},
  {title:'風扇 PWM', unit:'', cols:['fan_pwm']},
  {title:'節流 (throttled)', unit:'', min:0, max:1, cols:['throttled']},
  {title:'可用記憶體 (MB)', unit:'MB', cols:['mem_avail_mb']},
  {title:'Cooling device 狀態（cd_*）', unit:'', pattern:/^cd_/},
];

/* ---------- 摘要卡片 ---------- */
function buildCards(){
  const c=D.cols, t=D.t, cards=[];

  const diffs=[]; for(let i=1;i<D.n;i++) diffs.push(t[i]-t[i-1]);
  diffs.sort((a,b)=>a-b);
  const step=diffs.length?diffs[diffs.length>>1]:0;
  cards.push(['主檔記錄時間',fmtT(t[D.n-1]),`${D.n} 筆 · 取樣間隔約 ${Math.round(step)} 秒`]);

  let best={v:-Infinity,k:null,i:0};
  for(const k of Object.keys(c)){
    if(!k.endsWith('_C')||!isNumCol(c,k)) continue;
    c[k].forEach((v,i)=>{ if(!isNaN(v)&&v>best.v) best={v,k,i}; });
  }
  if(best.k) cards.push(['全域最高溫',best.v.toFixed(1)+' °C',`${label(best.k)} @ ${fmtT(t[best.i])}`]);

  if(isNumCol(c,'cpu_max_C')){const s=stats(c.cpu_max_C); cards.push(['CPU 最高溫',s.max.toFixed(1)+' °C','平均 '+s.avg.toFixed(1)+' °C']);}
  if(isNumCol(c,'gpu_max_C')){const s=stats(c.gpu_max_C); cards.push(['GPU 最高溫',s.max.toFixed(1)+' °C','平均 '+s.avg.toFixed(1)+' °C']);}
  if(isNumCol(c,'cpu_busy_pct')){const s=stats(c.cpu_busy_pct); cards.push(['CPU 使用率',s.avg.toFixed(1)+' %','max '+s.max.toFixed(1)+' %']);}
  if(isNumCol(c,'gpu_busy_pct')){const s=stats(c.gpu_busy_pct); cards.push(['GPU 使用率',s.avg.toFixed(1)+' %','max '+s.max.toFixed(1)+' %']);}
  if(isNumCol(c,'ddr_ebi_peak_MBps')){
    const s=stats(c.ddr_ebi_peak_MBps);
    const a=isNumCol(c,'ddr_ebi_avg_MBps')?'平均 '+stats(c.ddr_ebi_avg_MBps).avg.toFixed(0)+' MB/s':'';
    cards.push(['DDR 峰值頻寬',s.max.toFixed(0)+' MB/s',a]);
  }
  if(isNumCol(c,'fan_rpm')){const s=stats(c.fan_rpm); cards.push(['風扇轉速',s.max.toFixed(0)+' RPM','平均 '+s.avg.toFixed(0)]);}
  if(isNumCol(c,'throttled')){
    const k=c.throttled.filter(v=>v===1).length;
    cards.push(['節流取樣',k+' 筆',`共 ${D.n} 筆`]);
  }
  if(E){
    const sc=E.cur&&stats(E.cur);
    if(sc) cards.push(['外部電流 峰值',sc.max.toFixed(3)+' A',`平均 ${sc.avg.toFixed(3)} A`]);
    const sp=E.pwr&&stats(E.pwr);
    if(sp) cards.push(['外部功率 峰值',sp.max.toFixed(2)+' W',`平均 ${sp.avg.toFixed(2)} W`]);
    const sv=E.v105&&stats(E.v105);
    if(sv) cards.push(['電壓 (Chan 105)',sv.avg.toFixed(3)+' V',`min ${sv.min.toFixed(3)} / max ${sv.max.toFixed(3)} V`]);
  }

  CARD_NAMES=cards.map(c=>c[0]);
  $('#cards').classList.toggle('hidden',!SET.cardsOn);
  $('#cards').innerHTML=cards.filter(x=>!SET.hideCards.includes(x[0])).map(([k,v,s])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div>`).join('');
}

/* ---------- 建立圖表 ---------- */
function build(){
  hoverT=null; hoverChart=null;
  const box=$('#charts'); box.innerHTML=''; charts=[];
  CHART_NAMES=[];
  buildCards();
  const c=D.cols;

  // 外部電流檔（獨立時間軸 E.tt，與主檔共用 x 軸）；欄位缺少或全為 NA 則略過
  if(E){
    for(const sp of EXT_SPECS){
      const data=E[sp.key];
      const st=data&&stats(data);
      if(!st) continue;
      const key='外部：'+sp.title; CHART_NAMES.push(key);
      if(SET.hideCharts.includes(key)) continue;
      addChart({title:`${sp.title}｜外部 CSV：${E.name}`, unit:sp.unit},[{
        key:sp.key, name:sp.name, data, t:E.tt, clock:E.clock, dec:sp.dec,
        hidden:false, color:sp.color, width:1.6, st
      }]);
    }
  }

  for(const g of GROUPS){
    const names=g.cols
      ? g.cols.filter(k=>isNumCol(c,k))
      : Object.keys(c).filter(k=>g.pattern.test(k)&&isNumCol(c,k));
    if(!names.length) continue;
    CHART_NAMES.push(g.title);
    if(SET.hideCharts.includes(g.title)) continue;
    if(g.top) names.sort((a,b)=>stats(c[b]).max-stats(c[a]).max);

    const series=names.map((k,i)=>({
      key:k, name:label(k), data:c[k], t:D.t,
      hidden:!!g.top && i>=g.top,
      color:k===g.bold?css('--mark'):`hsl(${Math.round(i*360/names.length)},65%,50%)`,
      width:k===g.bold?2.4:1.4, st:stats(c[k])
    }));
    addChart(g,series);
  }
  drawAll();
}

function addChart(g,series){
  const box=$('#charts');
  const el=document.createElement('div'); el.className='chart';
  const tools=g.toggleAll?`<div class="tools"><button class="btn sm" data-act="on">全部顯示</button><button class="btn sm ghost" data-act="off">全部隱藏</button></div>`:'';
  el.innerHTML=`<div class="chart-head"><h2>${g.title}</h2>${tools}</div><canvas></canvas><div class="legend${g.tall?' tall':''}"></div>`;
  box.appendChild(el);

  const ch={g,series,canvas:el.querySelector('canvas'),legend:el.querySelector('.legend')};
  ch.legend.innerHTML=series.map((s,i)=>`<span class="chip${s.hidden?' off':''}" data-i="${i}"><i style="background:${s.color}"></i>${s.name}<small>${fmtN(s.st.min,s.dec||1)} / ${fmtN(s.st.avg,s.dec||1)} / ${fmtN(s.st.max,s.dec||1)}</small></span>`).join('');
  ch.legend.addEventListener('click',e=>{
    const chip=e.target.closest('.chip'); if(!chip) return;
    const s=series[+chip.dataset.i]; s.hidden=!s.hidden;
    chip.classList.toggle('off',s.hidden); drawAll();
  });
  const tb=el.querySelector('.tools');
  if(tb) tb.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const off=b.dataset.act==='off';
    series.forEach(s=>s.hidden=off);
    ch.legend.querySelectorAll('.chip').forEach(chip=>chip.classList.toggle('off',off));
    drawAll();
  });

  attach(ch); charts.push(ch);
}

/* ---------- 互動 ---------- */
function pxToT(px){
  const cv=charts[0].canvas, w=cv.clientWidth-PAD.l-PAD.r;
  return view.x0+(px-PAD.l)/w*(view.x1-view.x0);
}
function attach(ch){
  const cv=ch.canvas;
  cv.addEventListener('mousemove',e=>{
    const px=e.clientX-cv.getBoundingClientRect().left;
    hoverT=pxToT(px); hoverChart=ch;
    if(down!==null) sel=[Math.min(down,px),Math.max(down,px)];
    drawAll();
  });
  cv.addEventListener('mouseleave',()=>{hoverT=null;hoverChart=null;drawAll();});
  cv.addEventListener('mousedown',e=>{
    e.preventDefault();
    down=e.clientX-cv.getBoundingClientRect().left; sel=null;
  });
  cv.addEventListener('dblclick',resetView);
}
// 全域只註冊一次，避免重複載入時監聽器累積
window.addEventListener('mouseup',()=>{
  if(down===null) return;
  if(sel&&sel[1]-sel[0]>6&&charts.length){
    const a=pxToT(sel[0]), b=pxToT(sel[1]);
    const [ext0,ext1]=extent();
    view={x0:Math.max(ext0,a),x1:Math.min(ext1,b)};
    $('#reset').classList.remove('hidden');
  }
  down=null; sel=null; drawAll();
});

/* ---------- 繪圖 ---------- */
function drawAll(){ if(D) charts.forEach(draw); }

function draw(ch){
  const cv=ch.canvas, dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const M=PAD, pw=W-M.l-M.r, ph=H-M.t-M.b;
  const colGrid=css('--grid'), colAxis=css('--axis'), colMuted=css('--muted');

  // Y 範圍：只看可見時間區間內、顯示中的曲線
  let ymin=Infinity,ymax=-Infinity;
  for(const s of ch.series){ if(s.hidden) continue;
    const [i0,i1]=idxRange(s.t,view.x0,view.x1);
    for(let i=i0;i<=i1;i++){const v=s.data[i]; if(isNaN(v)) continue; if(v<ymin)ymin=v; if(v>ymax)ymax=v;}
  }
  if(!isFinite(ymin)){ymin=0;ymax=1;}
  if(ymax-ymin<1e-9){ymin-=1;ymax+=1;}
  const pad=(ymax-ymin)*0.06; ymin-=pad; ymax+=pad;
  if(ch.g.min!==undefined) ymin=ch.g.min;
  if(ch.g.max!==undefined) ymax=ch.g.max;
  const X=v=>M.l+(v-view.x0)/(view.x1-view.x0)*pw;
  const Y=v=>M.t+(1-(v-ymin)/(ymax-ymin))*ph;

  ctx.font='11px system-ui,sans-serif'; ctx.lineWidth=1;
  // Y 格線
  const ys=niceStep(ymax-ymin,5);
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let v=Math.ceil(ymin/ys)*ys; v<=ymax; v+=ys){
    const y=Math.round(Y(v))+.5;
    ctx.strokeStyle=colGrid; ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke();
    ctx.fillStyle=colMuted; ctx.fillText(+v.toFixed(6)+'',M.l-6,y);
  }
  // X 格線
  const steps=[1,2,5,10,15,30,60,120,300,600,900,1800,3600,7200,14400];
  const span=view.x1-view.x0; const xs=steps.find(s=>span/s<=9)||steps[steps.length-1];
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let v=Math.ceil(view.x0/xs)*xs; v<=view.x1; v+=xs){
    const x=Math.round(X(v))+.5;
    ctx.strokeStyle=colGrid; ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();
    ctx.fillStyle=colMuted; ctx.fillText(fmtT(v),x,M.t+ph+6);
  }
  ctx.strokeStyle=colAxis; ctx.strokeRect(M.l+.5,M.t+.5,pw,ph);

  // 曲線（裁切在繪圖區內；每條曲線用自己的時間軸）
  ctx.save(); ctx.beginPath(); ctx.rect(M.l,M.t,pw,ph); ctx.clip();
  if(D.stressT!==null&&D.stressT>=view.x0&&D.stressT<=view.x1){
    const x=Math.round(X(D.stressT))+.5;
    ctx.strokeStyle=css('--mark'); ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke(); ctx.setLineDash([]);
  }
  for(const s of ch.series){ if(s.hidden) continue;
    const [i0,i1]=idxRange(s.t,view.x0,view.x1);
    const stride=Math.max(1,Math.floor((i1-i0)/(pw*2)));
    ctx.strokeStyle=s.color; ctx.lineWidth=s.width; ctx.beginPath(); let pen=false;
    for(let i=i0;i<=i1;i+=stride){
      const v=s.data[i]; if(isNaN(v)){pen=false;continue;}
      const x=X(s.t[i]), y=Y(v);
      if(pen) ctx.lineTo(x,y); else {ctx.moveTo(x,y);pen=true;}
    }
    ctx.stroke();
  }
  ctx.restore();

  // 拖曳選取範圍
  if(sel&&hoverChart===ch){
    ctx.fillStyle='rgba(37,99,235,.18)'; ctx.fillRect(sel[0],M.t,sel[1]-sel[0],ph);
  }

  // 游標提示
  if(hoverT!==null&&hoverT>=view.x0&&hoverT<=view.x1){
    const x=Math.round(X(hoverT))+.5;
    ctx.strokeStyle=colAxis; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke(); ctx.setLineDash([]);

    const rows=[];
    for(const s of ch.series){ if(s.hidden) continue;
      const k=nearest(s.t,hoverT);
      if(k<0||isNaN(s.data[k])) continue;
      rows.push({s,k,v:s.data[k]});
      ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(X(s.t[k]),Y(s.data[k]),3,0,6.3); ctx.fill();
    }

    if(hoverChart===ch&&!sel){
      const kd=nearest(D.t,hoverT);
      const ts=(D.iso&&kd>=0&&D.iso[kd])?String(D.iso[kd]).replace('T',' ').replace(/\+.*$/,''):'';
      const lines=[fmtT(hoverT)+(ts?'   '+ts:'')];
      rows.slice(0,14).forEach(r=>{
        const extra=r.s.clock?`  (${r.s.clock[r.k]})`:'';
        lines.push([r.s,`${r.s.name}: ${fmtN(r.v,r.s.dec||2)} ${ch.g.unit}${extra}`]);
      });
      if(rows.length>14) lines.push('… 其餘 '+(rows.length-14)+' 條');

      ctx.font='12px system-ui,sans-serif';
      const wTxt=Math.max(...lines.map(l=>ctx.measureText(typeof l==='string'?l:l[1]).width))+30;
      const bh=lines.length*17+8; let bx=x+12; if(bx+wTxt>W-4) bx=x-12-wTxt; const by=M.t+4;
      ctx.fillStyle=css('--tip'); ctx.fillRect(bx,by,wTxt,bh);
      ctx.textAlign='left'; ctx.textBaseline='middle';
      lines.forEach((l,i)=>{
        const y=by+4+i*17+8.5;
        if(typeof l==='string'){ctx.fillStyle=css('--tiptext');ctx.fillText(l,bx+8,y);}
        else{ctx.fillStyle=l[0].color;ctx.fillRect(bx+8,y-1.5,10,3);ctx.fillStyle=css('--tiptext');ctx.fillText(l[1],bx+22,y);}
      });
    }
  }
}

/* ---------- 檔案載入（可多選、可拖曳） ---------- */
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value=''; };
const drop=$('#drop');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
document.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
window.addEventListener('resize',drawAll);

/* ---------- 顯示設定（存在瀏覽器 localStorage，下次開啟沿用） ---------- */
function openSettings(){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const list=(names,hide,cls)=>names.map(n=>`<label><input type="checkbox" class="${cls}" value="${esc(n)}"${hide.includes(n)?'':' checked'}>${esc(n)}</label>`).join('');
  $('#set-cards-on').checked=SET.cardsOn;
  $('#set-cards').innerHTML=list(CARD_NAMES,SET.hideCards,'sc');
  $('#set-charts').innerHTML=list(CHART_NAMES,SET.hideCharts,'sg');
  $('#set-cards').classList.toggle('dim',!SET.cardsOn);
  $('#setdlg').showModal();
}
$('#setbtn').onclick=openSettings;
$('#set-cards-on').onchange=e=>$('#set-cards').classList.toggle('dim',!e.target.checked);
$('#setdlg').addEventListener('click',e=>{
  const b=e.target.closest('[data-all]'); if(!b) return;
  $('#set-'+b.dataset.all).querySelectorAll('input').forEach(i=>i.checked=b.dataset.v==='1');
});
$('#setcancel').onclick=()=>$('#setdlg').close();
$('#setreset').onclick=()=>{
  $('#set-cards-on').checked=true; $('#set-cards').classList.remove('dim');
  $('#setdlg').querySelectorAll('.set-list input').forEach(i=>i.checked=true);
};
$('#setok').onclick=()=>{
  const off=cls=>[...document.querySelectorAll('.'+cls)].filter(i=>!i.checked).map(i=>i.value);
  // 保留本次檔案未出現的項目設定（換檔時不遺失）
  const keep=(old,names)=>old.filter(n=>!names.includes(n));
  SET={cardsOn:$('#set-cards-on').checked,
       hideCards:[...keep(SET.hideCards,CARD_NAMES),...off('sc')],
       hideCharts:[...keep(SET.hideCharts,CHART_NAMES),...off('sg')]};
  try{localStorage.setItem(SET_KEY,JSON.stringify(SET));}catch(e){}
  $('#setdlg').close(); build();
};

/* ---------- 輸出 PDF（瀏覽器列印 → 另存為 PDF） ---------- */
// 列印時：清除游標提示、以高解析度重繪；只輸出目前的縮放範圍與顯示中的曲線
let printing=false;
const _dpr=Object.getOwnPropertyDescriptor(window,'devicePixelRatio');
const isoStr=i=>D.iso&&D.iso[i]?String(D.iso[i]).replace('T',' ').replace(/\+.*$/,''):'';
function beforePrint(){
  if(!D||printing) return; printing=true;
  hoverT=null; hoverChart=null; sel=null;
  const t0=isoStr(0), t1=isoStr(D.n-1);
  $('#printinfo').textContent=`範圍 ${fmtT(view.x0)} – ${fmtT(view.x1)}${t0?`　｜　${t0} ~ ${t1}`:''}${E?`　｜　電流檔：${E.name}（位移 ${E.offset} 秒）`:''}　｜　輸出於 ${new Date().toLocaleString()}`;
  Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:()=>3});
  drawAll();
}
function afterPrint(){
  if(!printing) return; printing=false;
  if(_dpr) Object.defineProperty(window,'devicePixelRatio',_dpr); else delete window.devicePixelRatio;
  drawAll();
}
window.addEventListener('beforeprint',beforePrint);
window.addEventListener('afterprint',afterPrint);
$('#pdf').onclick=()=>{
  const old=document.title;
  document.title=(D.name||'report').replace(/\.csv$/i,'')+'_report';   // 預設 PDF 檔名
  beforePrint(); window.print(); afterPrint();
  document.title=old;
};

if(EMBEDDED) load(EMBEDDED.text,EMBEDDED.name);
</script>
